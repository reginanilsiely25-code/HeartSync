stages:
  - test
  - build

unit-test:
  image: node:20
  stage: test
  script:
    - npm ci
    - npm run verify
    - npm --workspace apps/backend run build

docker-build:
  image: docker:27
  stage: build
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -f apps/backend/Dockerfile -t heartsync-backend:ci .
    - docker build -f apps/web/Dockerfile -t heartsync-web:ci .
