services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: file:/app/apps/backend/prisma/dev.db
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - backend-data:/app/apps/backend/prisma

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend-data:
